# Create with:   conda env create -f environment.yml
# Activate with: conda activate newsdesk
# Update after editing this file: conda env update -f environment.yml --prune
name: newsdesk
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pandas>=2.0
  - requests>=2.31
  - pyyaml>=6.0
  - pydantic>=2.5
  - feedparser>=6.0
  - streamlit>=1.30
  - pytest>=7
  - ipykernel          # use the env from Jupyter / VS Code notebooks
  - pip:
      - -e .           # installs the newsdesk package and its `newsdesk` command