[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsdesk"
version = "0.1.0"
description = "Local-LLM news research tool for retail traders"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
newsdesk = "newsdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
